display_information:
  name: Antigravity CLI
  description: Chat with Google Antigravity CLI (agy) directly from Slack threads
  background_color: "#1a73e8"
features:
  bot_user:
    display_name: Antigravity
    always_online: true
  slash_commands:
    - command: /agy
      description: Control or prompt Antigravity CLI (status, reset, cancel, model, mode, help)
      usage_hint: "[status | reset | cancel | model <name> | mode <auto|accept-edits|plan> | <prompt>]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - groups:history
      - im:history
      - im:read
      - im:write
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
